<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 194" width="760" height="194" role="img" aria-label="Continuous batching, 8 concurrent requests"><rect width="760" height="194" fill="#fcfcfb"/><text x="24" y="28" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#17191c" text-anchor="start">Continuous batching, 8 concurrent requests</text><rect x="210" y="52" width="298.8" height="30" rx="4" fill="#9aa1a8"/><text x="198" y="72" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#4a5159" text-anchor="end">batching off</text><text x="518.7905216389665" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#17191c" text-anchor="start">48.42 tok/s</text><rect x="210" y="104" width="381.4" height="30" rx="4" fill="#2a78d6"/><text x="198" y="124" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#4a5159" text-anchor="end">batching on</text><text x="601.3559322033898" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#17191c" text-anchor="start">61.8 tok/s</text><line x1="210" y1="44" x2="210" y2="142" stroke="#dfe1de" stroke-width="1"/><text x="24" y="180" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#757d86" text-anchor="start">1.28x aggregate throughput. Same prompts, server restarted between arms.</text></svg>
