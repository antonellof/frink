[package]
name = "frink-moe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Mixture-of-Experts routing and expert dispatch for Frink"
readme = "README.md"
keywords = ["moe", "llm", "inference", "routing", "frink"]
categories = ["algorithms", "science"]

[dependencies]
frink-core = { workspace = true }
frink-quant = { workspace = true }
rayon = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
frink-quant = { workspace = true }
# What a CUDA decode matvec reads of its activation (q8_1 under the dp4a
# default), for the GPU test's CPU reference.
frink-cuda = { workspace = true }

[features]
default = []
cuda = ["frink-core/cuda"]
metal = ["frink-core/metal"]
vulkan = ["frink-core/vulkan"]
