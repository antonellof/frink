[package]
name = "frink-cuda"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CUDA/NVRTC kernels for the Frink inference engine"
readme = "README.md"
keywords = ["cuda", "gpu", "llm", "nvidia", "frink"]
categories = ["hardware-support", "science"]

[dependencies]
thiserror = { workspace = true }
# The IQ grid tables the kernels embed are generated from
# `frink_quant::iq_tables`, and the dequant twins read the same arrays.
frink-quant = { workspace = true }

# CUDA support via cudarc's dynamic-loading mode: no CUDA toolkit/nvcc
# is required to *build* this crate (the driver/NVRTC libraries are
# loaded at runtime via dlopen, not linked at compile time). This
# means `cargo build
# --features cuda` succeeds even in this sandbox, which has no GPU and
# no CUDA toolkit installed -- but it also means the actual kernels in
# src/gpu.rs have never been executed against real hardware. See
# this crate's module docs before trusting anything beyond "it
# compiles."
#
# Pinned to exactly 0.11.9: newer cudarc releases (0.19.x) transitively
# require libloading >=0.9, which needs rustc >=1.88; 0.18.x uses C
# string literals and other features needing rustc >=1.77. 0.11.9 is
# the newest release whose full dependency tree was confirmed (by
# actually running `cargo build --features cuda` in this sandbox) to
# build under the rustc 1.75 available here. If this project is later
# built on a newer toolchain, revisit this pin -- there is no reason to
# stay on 0.11.9 once the constraint is gone.
cudarc = { version = "=0.11.9", optional = true, default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "cuda-11080",
] }

[dev-dependencies]
half = { workspace = true }

[features]
default = []
cuda = ["dep:cudarc"]
