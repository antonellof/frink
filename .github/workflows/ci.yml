name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --verbose
      - run: cargo test --workspace --verbose

  cuda-scaffolding:
    name: build --features cuda (compile only, no GPU on CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p frink-cuda --features cuda --verbose

  # CONTRIBUTING.md: the cuda feature must keep compiling without a GPU
  # or CUDA toolkit present through the full CLI/server dependency chain.
  cuda-feature-chain:
    name: clippy/build --features cuda (cli + server chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p frink-cli -p frink-server --features cuda --verbose
      - run: cargo clippy -p frink-cli -p frink-server --features cuda -- -D warnings

  # Metal kernels are Apple-only; compile the feature chain on macOS.
  metal-feature-chain:
    name: clippy/build --features metal (macos compile only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p frink-metal -p frink-cli -p frink-server --features metal --verbose
      - run: cargo clippy -p frink-metal -p frink-cli -p frink-server --features metal -- -D warnings

  # The Metal kernels, ON A GPU.
  #
  # `frink-metal` carries 71 `#[ignore]`d tests whose reason is "needs a
  # real Metal GPU", and until this job every one of them ran only on a
  # maintainer's laptop: CI compiled the kernels and never executed
  # one. GitHub's `macos-latest` runners are Apple silicon with a
  # working Metal device, and these tests need no checkpoint -- they
  # build their inputs from `Lcg` output and compare against a CPU
  # twin -- so there is nothing to download and nothing to cache.
  #
  # Kept as a separate job from the compile one so a kernel that fails
  # on the GPU is not reported as a build break, and so the compile
  # gate still answers on a runner outage here.
  #
  # MEASURED on the hosted runner, because a green check that silently
  # skipped every test would be worse than no job: 71 passed, 0 failed,
  # 31.02s (run 35503018762). The `system_profiler` step above is kept
  # so the device is named in the log and a future skip is visible
  # rather than inferred.
  metal-gpu-tests:
    name: cargo test --features metal -- --ignored (real GPU)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Metal device present
        run: system_profiler SPDisplaysDataType | head -20
      # Both halves: the default set must stay green on a GPU too, and
      # the `--ignored` set is the one that has never run here.
      - run: cargo test -p frink-metal --features metal --verbose
      - run: cargo test -p frink-metal --features metal -- --ignored --test-threads=1

  # What the release tarball actually ships, in the PROFILE it ships in.
  #
  # `release.yml` builds the CLI with `serve` (plus `metal` on macOS),
  # and no CI job built that combination: the cuda and metal jobs both
  # leave `serve` off. So a break confined to the `serve` feature would
  # have reached users through the install script with CI green, which
  # is the one path where a compile error is guaranteed to be somebody
  # else's first experience of the project.
  #
  # `--release` matters as much as the features, and this job did not
  # have it at first. Nothing else in CI builds release either: every
  # other step is a debug build, and `release.yml` only runs on a tag,
  # which is after merge and too late. A real break got through exactly
  # that way: `PagedLease::tables_match_groups` is
  # `#[cfg(debug_assertions)]` and was called from a `debug_assert!`,
  # which still TYPE-CHECKS its argument in release, so the method did
  # not exist where the call did and every release build of
  # frink-server failed to compile while all of CI stayed green.
  #
  # Anything gated on `debug_assertions` has this shape, so the gate is
  # the profile, not the feature.
  serve-feature-chain:
    name: build --release (what the tarball ships; serve is default)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            features: metal
          - os: ubuntu-latest
            features: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Release profile on purpose: see the comment above this job.
      - run: cargo build --release -p frink-cli --features "${{ matrix.features }}" --verbose
      - run: cargo clippy --release -p frink-cli --all-targets --features "${{ matrix.features }}" -- -D warnings

  # Frink Studio (ui/) is a standalone app: nothing it builds is
  # committed and nothing ships inside a Rust crate, so there is no
  # stale-artefact check to run. What CI does owe this directory is the
  # three gates a Rust reviewer cannot run by reading the diff -- does
  # it typecheck, does it lint, does it build -- plus the licence sweep,
  # which is not a formality: the bundle is DISTRIBUTED, so a copyleft
  # dependency would ship to every viewer, and frink is Apache-2.0.
  ui:
    name: ui typecheck + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run licenses
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
